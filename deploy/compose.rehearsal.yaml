name: aisidequest-rehearsal

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aisidequest
      POSTGRES_USER: aisidequest
      POSTGRES_PASSWORD: rehearsal-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisidequest -d aisidequest"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - rehearsal_postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: aisidequest-api:rehearsal
    env_file:
      - rehearsal.env.example
    command: ["node", "--enable-source-maps", "server/dist/database/run-migrations.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles:
      - operations

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: aisidequest-api:rehearsal
    env_file:
      - rehearsal.env.example
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 20

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: aisidequest-web:rehearsal
    environment:
      SITE_ADDRESS: :8080
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  rehearsal_postgres:

