name: aisidequest-${DEPLOYMENT_ENVIRONMENT:-production}

services:
  api:
    image: ${AISIDEQUEST_API_IMAGE:?set AISIDEQUEST_API_IMAGE to a digest-pinned image}
    env_file:
      - ${AISIDEQUEST_ENV_FILE:?set AISIDEQUEST_ENV_FILE}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 12
    networks:
      - backend

  migrate:
    image: ${AISIDEQUEST_API_IMAGE:?set AISIDEQUEST_API_IMAGE to a digest-pinned image}
    env_file:
      - ${AISIDEQUEST_ENV_FILE:?set AISIDEQUEST_ENV_FILE}
    command: ["node", "--enable-source-maps", "server/dist/database/run-migrations.js"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    profiles:
      - operations
    networks:
      - backend

  web:
    image: ${AISIDEQUEST_WEB_IMAGE:?set AISIDEQUEST_WEB_IMAGE to a digest-pinned image}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS to the public hostname}
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:

volumes:
  caddy_data:
  caddy_config:
