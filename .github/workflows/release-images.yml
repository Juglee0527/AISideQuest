name: Release images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build immutable deployment images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push API and web images
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          api_tag="ghcr.io/${repository}/api:${GITHUB_SHA}"
          web_tag="ghcr.io/${repository}/web:${GITHUB_SHA}"
          docker build --pull --file deploy/Dockerfile.api --tag "$api_tag" .
          docker build --pull --file deploy/Dockerfile.web --tag "$web_tag" .
          docker push "$api_tag"
          docker push "$web_tag"
          api_ref=$(docker inspect --format='{{index .RepoDigests 0}}' "$api_tag")
          web_ref=$(docker inspect --format='{{index .RepoDigests 0}}' "$web_tag")
          jq -n \
            --arg serviceVersion "git-${GITHUB_SHA}" \
            --arg apiImage "$api_ref" \
            --arg webImage "$web_ref" \
            '{serviceVersion:$serviceVersion,apiImage:$apiImage,webImage:$webImage}' \
            > release-manifest.json
      - name: Upload digest-pinned release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload matching Codex plugin bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aisidequest-codex-plugin-${{ github.sha }}
          path: |
            .agents/plugins/marketplace.json
            plugins/aisidequest
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
