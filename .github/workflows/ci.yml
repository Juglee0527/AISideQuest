name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FORCE_COLOR: 0
  TZ: UTC

jobs:
  quality:
    name: Quality / lint, types, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high

  unit:
    name: Tests / client, server, plugin, operations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run test:client
      - run: npm run test:server
      - run: npm run test:plugin
      - run: npm run test:operations

  postgres:
    name: Tests / PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aisidequest_test
          POSTGRES_USER: aisidequest
          POSTGRES_PASSWORD: aisidequest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aisidequest -d aisidequest_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://aisidequest:aisidequest@127.0.0.1:5432/aisidequest_test
      ALLOW_DATABASE_RESET: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run test:postgres

  migrations:
    name: Tests / migration, seed, upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aisidequest_migration_test
          POSTGRES_USER: aisidequest
          POSTGRES_PASSWORD: aisidequest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aisidequest -d aisidequest_migration_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://aisidequest:aisidequest@127.0.0.1:5432/aisidequest_migration_test
      ALLOW_DATABASE_RESET: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run test:migrations

  browser:
    name: Tests / Chromium core flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build:client
      - name: Start client and run the browser flow once
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/aisidequest-vite.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            if [[ "$attempt" == 30 ]]; then
              echo "Vite preview did not become ready"
              exit 1
            fi
            sleep 1
          done
          npm run test:e2e
      - name: Upload sanitized browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-${{ github.run_id }}
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 3

  required-checks:
    name: Required checks
    if: always()
    needs: [quality, unit, postgres, migrations, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Reject any skipped, cancelled, or failed gate
        shell: bash
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "CI job results: $results"
          [[ "$results" != *failure* ]]
          [[ "$results" != *cancelled* ]]
          [[ "$results" != *skipped* ]]
